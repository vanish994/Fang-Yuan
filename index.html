<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Fang-Yuan</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        background: #000;
        overflow: hidden;
      }
      #game-container {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
      }
      #game-container canvas {
        display: block;
      }
      /* Celular: o toque não rola a página nem seleciona texto/imagens. */
      #game-container,
      #game-container canvas {
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* Em celular em pé, pede para girar: o jogo é pensado para landscape. */
      #rotate-hint {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 1000;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        background: #101820;
        color: #ffffff;
        font-family: sans-serif;
        font-size: 20px;
        text-align: center;
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate-hint {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="rotate-hint">Gire o aparelho para jogar na horizontal</div>
    <div id="game-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
